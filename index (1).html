<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUDY ROOM</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('sr-theme')||'dark'</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--sec:#334155;--tx:#f8fafc;--mu:#94a3b8;--bd:rgba(71,85,105,.6);--ac:#6366f1;--ach:#818cf8}
[data-theme=light]{--bg:#f1f5f9;--card:#fff;--sec:#f8fafc;--tx:#0f172a;--mu:#475569;--bd:#cbd5e1;--ac:#4f46e5;--ach:#4338ca}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:20px 16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:20px;letter-spacing:.04em}.sub{color:var(--mu);font-size:12px}
.sp{flex:1}nav{display:flex;gap:4px}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--sec);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.p:hover{background:var(--ach)}
input,select{background:var(--sec);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:14px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.stats{display:flex;flex-wrap:wrap}.stats>div{flex:1 1 150px;padding:4px 14px;border-left:1px solid var(--bd)}.stats>div:first-child{border:0;padding-left:0}
.lb{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}.v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.clock{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}.dot.active{background:#22c55e}.dot.paused{background:#f59e0b}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);display:grid;place-items:center;color:#fff;font-weight:600}
.bar{height:5px;background:var(--sec);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:11px;text-transform:uppercase;cursor:pointer}
.hide{display:none!important}#login{max-width:340px;margin:12vh auto;display:grid;gap:10px}.err{color:#f87171;font-size:12px}
</style></head>
<body><div class="w">
<div id="login" class="card hide"><h1>STUDY ROOM</h1><div class="sub">Sign in with your member account</div>
<input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button class="p" id="go">Sign in</button><div id="le" class="err"></div></div>

<div id="app" class="hide">
<header><div><h1>STUDY ROOM</h1><div class="sub">Study Time Visualizer</div></div><div class="sp"></div>
<nav id="nav"><button data-v="dash" class="on">Dashboard</button><button data-v="lb">Leaderboard</button><button data-v="an">Analytics</button></nav>
<button id="th">◐</button><div class="av" id="me"></div><button id="out">Sign out</button></header>
<div id="err" class="err"></div>

<section id="dash"><div class="card stats" id="ov"></div>
<div class="card" style="margin-top:14px"><div class="row"><span class="lb">Collective daily progress</span><span class="sp"></span><span id="cp" class="sub"></span></div><div class="bar" style="margin-top:8px"><i id="cb" style="width:0"></i></div></div>
<div class="grid" id="cards"></div></section>

<section id="lb" class="hide"><div class="card"><div class="row" id="modes" style="margin-bottom:10px">
<button data-m="today" class="on">Daily</button><button data-m="week">Weekly</button><button data-m="month">Monthly</button><button data-m="all">All-Time</button></div>
<table><thead><tr><th>#</th><th>Member</th><th data-s="today">Today</th><th data-s="week">Week</th><th data-s="month">Month</th><th data-s="all">All-Time</th><th data-s="n">Sessions</th></tr></thead><tbody id="lbb"></tbody></table></div></section>

<section id="an" class="hide"><div class="row" style="margin-bottom:10px"><button data-d="7" class="on">7 Days</button><button data-d="30">30 Days</button><button data-d="90">90 Days</button></div>
<div class="card"><div class="lb">Daily study duration by member (hours)</div><canvas id="ch1" height="110"></canvas></div>
<div class="card" style="margin-top:14px"><div class="lb">Member comparison — selected range (hours)</div><canvas id="ch2" height="90"></canvas></div></section>
</div></div>

<script>
// ---- CONFIG: replace with your project values (publishable key only!) ----
const SUPABASE_URL="https://YOUR_PROJECT.supabase.co", SUPABASE_PUBLISHABLE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=s=>document.querySelector(s), TZ='Asia/Jakarta';
let members=[],sessions={},goals={},stats=[],counts={},meId=null,mode='today',sortK=null,days=7,charts={},timer;
const fmt=s=>{s=Math.max(0,Math.floor(s));return`${Math.floor(s/3600)}h ${String(Math.floor(s%3600/60)).padStart(2,'0')}m`};
const clock=s=>{s=Math.max(0,Math.floor(s));return[s/3600|0,s%3600/60|0,s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const ymd=d=>d.toLocaleDateString('sv',{timeZone:TZ});
const addD=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const today=()=>ymd(new Date());
const wk=()=>{const t=today(),dow=(new Date(t+'T00:00:00Z').getUTCDay()+6)%7;return addD(t,-dow)};
const el=s=>{const e=sess(s);return e?e.accumulated_seconds+(e.status==='active'?(Date.now()-new Date(e.last_resumed_at))/1000:0):0};
const sess=id=>sessions[id];
const err=m=>$('#err').textContent=m||'';

async function boot(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){$('#login').classList.remove('hide');$('#app').classList.add('hide');return}
 const{data:ms,error}=await sb.from('members').select('*').order('slot_number');
 if(error||!ms?.length){await sb.auth.signOut();$('#login').classList.remove('hide');$('#le').textContent='This account is not assigned to a member slot.';return}
 members=ms;meId=ms.find(m=>m.auth_user_id===session.user.id)?.id;
 if(!meId){await sb.auth.signOut();$('#login').classList.remove('hide');$('#le').textContent='This account is not assigned to a member slot.';return}
 $('#login').classList.add('hide');$('#app').classList.remove('hide');
 await load();subscribe();clearInterval(timer);timer=setInterval(tick,1000);
}
async function load(){
 const[a,b,c,d]=await Promise.all([
  sb.from('study_sessions').select('*').in('status',['active','paused']),
  sb.from('study_goals').select('*'),
  sb.rpc('daily_stats',{p_from:'2000-01-01',p_to:today()}),
  sb.from('study_sessions').select('member_id').eq('status','completed')]);
 if(a.error||c.error)return err('Load failed: '+(a.error||c.error).message);
 err('');sessions={};a.data.forEach(s=>sessions[s.member_id]=s);
 goals={};(b.data||[]).forEach(g=>goals[g.member_id]=g);stats=c.data;
 counts={};(d.data||[]).forEach(r=>counts[r.member_id]=(counts[r.member_id]||0)+1);
 const{data:ms}=await sb.from('members').select('*').order('slot_number');if(ms)members=ms;
 render();
}
const tot=(id,from)=>stats.filter(r=>r.member_id===id&&r.day>=from).reduce((a,r)=>a+r.seconds,0);
const totals=id=>({today:tot(id,today()),week:tot(id,wk()),month:tot(id,today().slice(0,8)+'01'),all:tot(id,'2000-01-01'),n:counts[id]||0});
function render(){
 const me=members.find(m=>m.id===meId);$('#me').textContent=me.display_name[0];$('#me').title=me.display_name;
 const T=members.map(m=>totals(m.id)),sum=k=>T.reduce((a,t)=>a+t[k],0);
 const live=Object.values(sessions).filter(s=>s.status==='active').length;
 const done=0;
 $('#ov').innerHTML=[['Today',fmt(sum('today'))],['This week',fmt(sum('week'))],['All-time',fmt(sum('all'))],['Studying now',live],['Sessions (all-time)',sum('n')]]
  .map(([l,v])=>`<div><div class="lb">${l}</div><div class="v">${v}</div></div>`).join('');
 const goal=members.reduce((a,m)=>a+(goals[m.id]?.daily_goal_seconds||0),0),td=sum('today');
 $('#cp').textContent=goal?`${fmt(td)} / ${fmt(goal)}`:'No goals set';$('#cb').style.width=goal?Math.min(100,td/goal*100)+'%':'0';
 $('#cards').innerHTML=members.map((m,i)=>{const s=sessions[m.id],st=s?s.status:'idle',mine=m.id===meId;
  return`<div class="card"><div class="row"><div class="av">${esc(m.display_name[0])}</div><b>${esc(m.display_name)}</b><span class="sp"></span><span class="dot ${st}"></span><span class="sub">${st}</span></div>
  <div class="clock" data-c="${m.id}">${clock(el(m.id))}</div>${s?.subject?`<div class="sub">${esc(s.subject)}</div>`:''}
  <div class="row sub"><span>Today ${fmt(T[i].today)}</span><span>Week ${fmt(T[i].week)}</span></div>
  ${mine?`<div class="row" style="margin-top:12px">${st==='idle'?`<input id="subj" placeholder="Subject (optional)" style="flex:1"><button class="p" data-a="start_study_session">Start</button>`:
   st==='active'?`<button data-a="pause_study_session">Pause</button><button class="p" data-a="finish_study_session">Finish</button>`:
   `<button class="p" data-a="resume_study_session">Resume</button><button data-a="finish_study_session">Finish</button><button data-a="cancel_study_session">Cancel</button>`}</div>`:''}</div>`}).join('');
 lbRender();anRender();
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tick(){document.querySelectorAll('[data-c]').forEach(e=>e.textContent=clock(el(e.dataset.c)))}
function lbRender(){
 const k=sortK||mode;let rows=members.map(m=>({m,...totals(m.id)})).sort((a,b)=>b[k]-a[k]);
 const max=Math.max(1,...rows.map(r=>r[mode]));let rank=0,prev=null;
 $('#lbb').innerHTML=rows.map((r,i)=>{if(r[k]!==prev)rank=i+1;prev=r[k];
  return`<tr><td>${r[k]>0?rank:'–'}</td><td>${esc(r.m.display_name)}<div class="bar" style="margin-top:5px"><i style="width:${r[mode]/max*100}%"></i></div></td><td>${fmt(r.today)}</td><td>${fmt(r.week)}</td><td>${fmt(r.month)}</td><td>${fmt(r.all)}</td><td>${r.n}</td></tr>`}).join('');
}
function anRender(){
 const dark=document.documentElement.dataset.theme==='dark',tc=dark?'#94a3b8':'#475569',gc=dark?'rgba(71,85,105,.35)':'#e2e8f0';
 const to=today(),from=addD(to,-(days-1)),labels=[];for(let d=from;d<=to;d=addD(d,1))labels.push(d);
 const pal=['#6366f1','#22c55e','#f59e0b','#ec4899','#06b6d4'];
 const opt={responsive:true,scales:{x:{ticks:{color:tc},grid:{color:gc}},y:{ticks:{color:tc},grid:{color:gc},beginAtZero:true}},plugins:{legend:{labels:{color:tc}}}};
 Object.values(charts).forEach(c=>c.destroy());
 charts.a=new Chart($('#ch1'),{type:'bar',data:{labels:labels.map(l=>l.slice(5)),datasets:members.map((m,i)=>({label:m.display_name,backgroundColor:pal[i],
  data:labels.map(l=>+((stats.find(r=>r.member_id===m.id&&r.day===l)?.seconds||0)/3600).toFixed(2))}))},options:opt});
 charts.b=new Chart($('#ch2'),{type:'bar',data:{labels:members.map(m=>m.display_name),datasets:[{label:'Hours',backgroundColor:pal,
  data:members.map(m=>+(stats.filter(r=>r.member_id===m.id&&r.day>=from).reduce((a,r)=>a+r.seconds,0)/3600).toFixed(2))}]},options:{...opt,plugins:{legend:{display:false}}}});
}
let ch;function subscribe(){
 if(ch)return;let t;const re=()=>{clearTimeout(t);t=setTimeout(load,250)};
 ch=sb.channel('room').on('postgres_changes',{event:'*',schema:'public',table:'study_sessions'},re)
  .on('postgres_changes',{event:'*',schema:'public',table:'members'},re).on('postgres_changes',{event:'*',schema:'public',table:'study_goals'},re)
  .subscribe(s=>{if(s==='SUBSCRIBED')load()});
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.a){b.disabled=true;const args=b.dataset.a==='start_study_session'?{p_subject:$('#subj')?.value||null}:{};
  const{error}=await sb.rpc(b.dataset.a,args);if(error)err(error.message);await load();return}
 if(b.dataset.v){document.querySelectorAll('section').forEach(s=>s.classList.toggle('hide',s.id!==b.dataset.v));
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.v==='an')anRender()}
 if(b.dataset.m){mode=b.dataset.m;sortK=null;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));lbRender()}
 if(b.dataset.d){days=+b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b));anRender()}
});
document.querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{sortK=t.dataset.s;lbRender()});
$('#th').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('sr-theme',n);anRender()};
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
 if(error)$('#le').textContent=error.message;else{$('#le').textContent='';boot()}};
boot();
</script></body></html>
